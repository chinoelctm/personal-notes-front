@if (store.modalCarpeta(); as modal) {
  <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-carpeta" (keydown.escape)="store.cerrarModalCarpeta()">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-sm w-full p-5 shadow-2xl border border-slate-200 dark:border-slate-700 fade-enter">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center shrink-0">
          <app-icono [nombre]="modal.modo === 'crear' ? 'folder-plus' : 'edit'" clase="w-5 h-5" />
        </div>
        <div>
          <h3 id="titulo-modal-carpeta" class="text-base font-bold text-slate-900 dark:text-white">{{ modal.modo === 'crear' ? 'Nueva carpeta' : 'Renombrar o mover carpeta' }}</h3>
          <p class="text-xs text-slate-500 dark:text-slate-400">Hasta {{ profundidadMaxima }} niveles de profundidad.</p>
        </div>
      </div>

      <form (ngSubmit)="guardar()" class="space-y-4">
        <div>
          <label for="nombre-carpeta" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Nombre</label>
          <input #campoNombre id="nombre-carpeta" name="nombre" type="text" [(ngModel)]="nombre" required maxlength="80" autocomplete="off"
                 placeholder="Ej. Proyectos, Finanzas, Sprint 1…"
                 class="w-full text-sm px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 dark:focus:ring-indigo-900 outline-none transition">
        </div>
        <div>
          <label for="padre-carpeta" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Ubicación</label>
          <select id="padre-carpeta" name="padre" [(ngModel)]="padreId"
                  class="w-full text-sm px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:border-indigo-500 outline-none transition">
            @for (opcion of opciones; track opcion.id) {
              <option [ngValue]="opcion.id">{{ opcion.etiqueta }}</option>
            }
          </select>
          @if (modal.modo === 'editar') {
            <p class="text-[11px] text-slate-400 mt-1">Solo se listan ubicaciones donde la carpeta y sus subcarpetas caben en el árbol.</p>
          }
        </div>

        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" (click)="store.cerrarModalCarpeta()" class="px-4 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">Cancelar</button>
          <button type="submit" [disabled]="guardando || !nombre.trim()" class="px-4 py-2.5 rounded-xl text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 disabled:opacity-60 text-white shadow-sm transition">
            {{ modal.modo === 'crear' ? 'Crear carpeta' : 'Guardar cambios' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
