<aside id="explorador" aria-label="Explorador de carpetas"
       class="vidrio-fuerte fixed md:static top-16 bottom-2 left-2 md:m-3 md:mr-0 z-40 w-72 md:w-64 lg:w-72 shrink-0 rounded-2xl overflow-hidden text-slate-700 dark:text-zinc-300 flex flex-col transition-transform duration-300 ease-out"
       [class.explorador-cerrado]="!store.sidebarAbierto()">

  <!-- Herramientas del árbol -->
  <div class="px-3 py-2 border-b border-white/60 dark:border-white/10 flex items-center justify-between">
    <div class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-zinc-400">
      <app-icono nombre="compass" clase="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400" />
      <span class="hidden md:inline">Explorador</span>
    </div>
    <div class="flex items-center gap-0.5">
      <button type="button" (click)="store.nuevoDocumento()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/60 dark:hover:bg-white/10 text-slate-500 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white transition" title="Nuevo documento en la carpeta actual">
        <app-icono nombre="file-plus" />
      </button>
      <button type="button" (click)="store.nuevoDocumento(null, 'Html')" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/60 dark:hover:bg-white/10 text-slate-500 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white transition" title="Nueva página HTML en la carpeta actual">
        <app-icono nombre="code-xml" />
      </button>
      <button type="button" (click)="store.nuevoDocumento(null, 'Markdown')" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/60 dark:hover:bg-white/10 text-slate-500 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white transition" title="Nuevo documento Markdown en la carpeta actual">
        <app-icono nombre="hash" />
      </button>
      <button type="button" (click)="store.abrirModalNuevaCarpeta(store.carpetaSeleccionadaId())" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/60 dark:hover:bg-white/10 text-slate-500 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white transition" title="Nueva carpeta en la carpeta actual">
        <app-icono nombre="folder-plus" />
      </button>
      <button type="button" (click)="store.colapsarTodo()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/60 dark:hover:bg-white/10 text-slate-500 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white transition" title="Colapsar todo">
        <app-icono nombre="chevrons-up-down" />
      </button>
    </div>
  </div>

  <!-- Acceso fijo al inicio -->
  <div class="p-2 border-b border-white/60 dark:border-white/10">
    <button type="button" (click)="store.irAInicio()" class="w-full flex items-center justify-between px-2.5 py-2 rounded-lg text-xs font-semibold transition"
            [class]="store.vista() === 'inicio' ? 'bg-gradient-to-r from-indigo-500 to-violet-500 text-white shadow-md shadow-indigo-500/25' : 'text-slate-700 dark:text-zinc-300 hover:bg-white/60 dark:hover:bg-white/10 hover:text-slate-900 dark:hover:text-white'">
      <span class="flex items-center gap-2">
        <app-icono nombre="layout-dashboard" [clase]="store.vista() === 'inicio' ? 'w-4 h-4 text-indigo-200' : 'w-4 h-4 text-indigo-600 dark:text-indigo-400'" />
        Inicio / Dashboard
      </span>
      <span class="text-[10px] px-1.5 py-0.5 rounded-full font-mono" [class]="store.vista() === 'inicio' ? 'bg-white/20 text-white' : 'bg-indigo-100 text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-200'" title="Documentos editados en las últimas horas">{{ store.resumen()?.recentlyEdited ?? 0 }} rec</span>
    </button>
  </div>

  <!-- Carpeta actual -->
  @if (store.carpetaSeleccionada(); as carpeta) {
    <div class="px-3 py-2 border-b border-white/60 dark:border-white/10 flex items-center justify-between gap-2 text-xs text-slate-500 dark:text-zinc-400">
      <span class="truncate flex items-center gap-1.5">
        <app-icono nombre="folder" clase="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400" />
        <span class="font-medium text-slate-800 dark:text-zinc-200 truncate">{{ carpeta.name }}</span>
      </span>
      <span class="px-1.5 py-0.5 rounded text-[10px] bg-white/60 dark:bg-white/10 text-slate-500 dark:text-zinc-400 font-mono shrink-0">{{ carpeta.documentCount }} docs</span>
    </div>
  }

  <!-- Árbol jerárquico -->
  <nav class="flex-1 overflow-y-auto scroll-oscuro p-2 space-y-0.5 text-sm" aria-label="Árbol de carpetas y documentos">
    @for (nodo of store.arbol(); track nodo.carpeta.id) {
      <app-nodo-arbol [nodo]="nodo" [nivel]="0" />
    } @empty {
      <div class="px-3 py-8 text-center text-xs text-slate-400 dark:text-zinc-500 space-y-3">
        <p>Aún no tienes carpetas.</p>
        <button type="button" (click)="store.abrirModalNuevaCarpeta(null)" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 dark:hover:text-indigo-300 font-semibold">Crear la primera carpeta</button>
      </div>
    }
  </nav>

  <!-- Acciones globales -->
  <div class="p-3 border-t border-white/60 dark:border-white/10 space-y-2 shrink-0">
    <button type="button" (click)="store.nuevoDocumento()" class="w-full h-11 bg-gradient-to-r from-indigo-500 to-violet-500 hover:from-indigo-600 hover:to-violet-600 text-white font-medium rounded-xl text-sm flex items-center justify-center gap-2 shadow-md shadow-indigo-500/25 transition">
      <app-icono nombre="plus-circle" />
      <span>Nuevo Documento</span>
    </button>
    <button type="button" (click)="store.abrirModalNuevaCarpeta(store.carpetaSeleccionadaId())" class="vidrio-sutil w-full h-10 hover:bg-white/70 dark:hover:bg-white/10 text-slate-800 dark:text-zinc-200 hover:text-slate-900 dark:hover:text-white font-medium rounded-xl text-xs flex items-center justify-center gap-2 transition">
      <app-icono nombre="folder-plus" clase="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400" />
      <span>Nueva Carpeta / Subcarpeta</span>
    </button>
    <!-- Teléfono: los respaldos viven aquí (en el header no caben junto al buscador) -->
    <div class="sm:hidden grid grid-cols-2 gap-2">
      <button type="button" (click)="store.exportarRespaldo()" class="vidrio-sutil h-10 rounded-xl text-xs font-medium text-slate-700 dark:text-zinc-200 flex items-center justify-center gap-1.5">
        <app-icono nombre="download" clase="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400" /> Exportar
      </button>
      <label for="importar-respaldo" class="vidrio-sutil h-10 rounded-xl text-xs font-medium text-slate-700 dark:text-zinc-200 flex items-center justify-center gap-1.5 cursor-pointer">
        <app-icono nombre="upload" clase="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400" /> Importar
      </label>
    </div>
  </div>
</aside>
