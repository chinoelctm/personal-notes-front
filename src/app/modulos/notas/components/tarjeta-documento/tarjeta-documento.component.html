<article class="h-full group relative flex flex-col bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-indigo-400 hover:shadow-md transition overflow-hidden">
  <button type="button" (click)="store.abrirDocumento(documento.id)" class="flex-1 flex flex-col text-left p-4 gap-2" [attr.aria-label]="'Abrir ' + documento.title">
    <span class="flex items-start justify-between gap-2 pr-8">
      <span class="font-semibold text-slate-900 dark:text-white leading-snug line-clamp-2">{{ documento.title }}</span>
    </span>
    <app-insignia-prioridad [prioridad]="documento.priority" [mostrarNinguna]="true" />
    <span class="flex-1 text-xs text-slate-500 dark:text-slate-400 leading-relaxed line-clamp-3">{{ vistaPrevia || 'Sin contenido todavía.' }}</span>
    <span class="flex flex-wrap items-center justify-between gap-x-3 gap-y-1 pt-2 mt-1 border-t border-slate-100 dark:border-slate-700 text-[11px] text-slate-400 dark:text-slate-500">
      <span [title]="'Creado el ' + (documento.createdOn | fechaHora)">Creado {{ documento.createdOn | fechaHora }}</span>
      <span class="flex items-center gap-1 text-slate-500 dark:text-slate-400 font-medium" [title]="'Editado el ' + (documento.updatedOn | fechaHora)">
        <app-icono nombre="clock" clase="w-3 h-3" />
        {{ documento.updatedOn | fechaRelativa }}
      </span>
    </span>
  </button>
  <button type="button" (click)="store.eliminarDocumento(documento)" class="absolute top-2 right-2 w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 md:opacity-0 md:group-hover:opacity-100 md:focus:opacity-100 transition" title="Eliminar documento">
    <app-icono nombre="trash" />
  </button>
</article>
