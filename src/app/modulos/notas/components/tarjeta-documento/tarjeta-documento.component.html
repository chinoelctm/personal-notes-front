<article class="vidrio levantar h-full group relative flex flex-col rounded-2xl overflow-hidden">
  <!-- Tinte de la tarjeta según su prioridad (como las tarjetas de colores del diseño) -->
  <div class="absolute inset-0 pointer-events-none bg-gradient-to-br to-transparent" [class]="prioridades[documento.priority].tinte" aria-hidden="true"></div>
  <button type="button" (click)="store.abrirDocumento(documento.id)" class="relative flex-1 flex flex-col text-left p-4 gap-2" [attr.aria-label]="'Abrir ' + documento.title">
    <span class="flex items-start justify-between gap-2 pr-8">
      <span class="font-semibold text-slate-900 dark:text-white leading-snug line-clamp-2">{{ documento.title }}</span>
    </span>
    <span class="flex flex-wrap items-center gap-1.5">
      <app-insignia-prioridad [prioridad]="documento.priority" [mostrarNinguna]="true" />
      @if (documento.type === 'Html') {
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold border bg-sky-50 text-sky-700 border-sky-200 dark:bg-sky-950/50 dark:text-sky-300 dark:border-sky-800">
          <app-icono nombre="code-xml" clase="w-3 h-3" /> HTML
        </span>
      } @else if (documento.type === 'Markdown') {
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold border bg-violet-50 text-violet-700 border-violet-200 dark:bg-violet-950/50 dark:text-violet-300 dark:border-violet-800">
          <app-icono nombre="hash" clase="w-3 h-3" /> Markdown
        </span>
      }
    </span>
    <span class="flex-1 text-xs text-slate-500 dark:text-slate-400 leading-relaxed line-clamp-3">{{ vistaPrevia || 'Sin contenido todavía.' }}</span>
    <span class="flex flex-wrap items-center justify-between gap-x-3 gap-y-1 pt-2 mt-1 border-t border-slate-900/[0.06] dark:border-white/10 text-[11px] text-slate-400 dark:text-slate-500">
      <span [title]="'Creado el ' + (documento.createdOn | fechaHora)">Creado {{ documento.createdOn | fechaHora }}</span>
      <span class="flex items-center gap-1 text-slate-500 dark:text-slate-400 font-medium" [title]="'Editado el ' + (documento.updatedOn | fechaHora)">
        <app-icono nombre="clock" clase="w-3 h-3" />
        {{ documento.updatedOn | fechaRelativa }}
      </span>
    </span>
  </button>
  <button type="button" (click)="store.eliminarDocumento(documento)" class="absolute top-2 right-2 w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-500/10 md:opacity-0 md:group-hover:opacity-100 md:focus:opacity-100 transition" title="Eliminar documento">
    <app-icono nombre="trash" />
  </button>
</article>
