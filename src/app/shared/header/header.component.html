<!-- Barra superior: una píldora de vidrio flotando sobre el fondo -->
<header class="h-14 shrink-0 z-30 px-2 sm:px-3 pt-2">
  <div class="vidrio-fuerte h-full rounded-2xl flex items-center justify-between gap-2 pl-1.5 pr-1.5 sm:pl-2.5">
    <div class="flex items-center gap-1 sm:gap-3 shrink-0">
      <!-- Hamburguesa: solo en teléfonos, abre el explorador -->
      <button type="button" (click)="store.alternarSidebar()" class="md:hidden flex items-center justify-center w-11 h-11 rounded-xl text-slate-700 dark:text-slate-200 hover:bg-white/60 dark:hover:bg-white/10 transition-colors"
              [attr.aria-expanded]="store.sidebarAbierto()" aria-controls="explorador" aria-label="Abrir o cerrar el explorador de carpetas">
        <app-icono [nombre]="store.sidebarAbierto() ? 'x' : 'menu'" clase="w-6 h-6" />
      </button>
      <button type="button" (click)="store.irAInicio()" class="hidden sm:flex items-center gap-2 rounded-xl" title="Ir al inicio">
        <span class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/30">
          <app-icono nombre="folder-tree" clase="w-5 h-5" />
        </span>
        <span class="hidden lg:inline font-bold text-slate-800 dark:text-white tracking-tight text-lg">Notas<span class="text-indigo-600 dark:text-indigo-400">IDE</span></span>
      </button>
    </div>

    <!-- Buscador global: títulos y contenido de todas las notas -->
    <div class="flex-1 min-w-0 max-w-md">
      <div class="relative flex items-center">
        <app-icono nombre="search" clase="w-4 h-4" class="absolute left-3 text-slate-400 dark:text-slate-400 pointer-events-none" />
        <input #buscador type="text" role="searchbox" enterkeyhint="search" [value]="store.consulta()" (input)="buscar(buscador.value)" (keydown.escape)="store.cerrarBusqueda()"
               placeholder="Buscar en títulos y contenido…" aria-label="Buscar notas por título o contenido"
               class="w-full bg-white/60 dark:bg-white/[0.07] hover:bg-white/80 dark:hover:bg-white/10 focus:bg-white dark:focus:bg-slate-900/80 text-slate-800 dark:text-slate-100 text-sm rounded-xl pl-9 pr-9 py-2 border border-white/70 dark:border-white/10 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-200/60 dark:focus:ring-indigo-500/30 outline-none transition placeholder:text-slate-400">
        @if (store.consulta()) {
          <button type="button" (click)="store.cerrarBusqueda()" class="absolute right-1 flex items-center justify-center w-8 h-8 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" title="Limpiar búsqueda">
            <app-icono nombre="x" />
          </button>
        }
      </div>
    </div>

    <div class="flex items-center gap-1 sm:gap-1.5 shrink-0">
      <button type="button" (click)="asistente.abrir()" class="flex items-center justify-center gap-1.5 h-10 px-2.5 sm:px-3 rounded-xl text-sm font-semibold text-white bg-gradient-to-r from-indigo-500 to-violet-500 hover:from-indigo-600 hover:to-violet-600 shadow-md shadow-indigo-500/25 transition" title="Abrir asistente de IA (Gemini)">
        <app-icono nombre="sparkles" />
        <span class="hidden xl:inline">Asistente IA</span>
      </button>

      <!-- Estado de sincronización -->
      <div class="hidden sm:flex items-center gap-1.5 text-xs font-medium px-2.5 py-1.5 rounded-xl border" [class]="estado().clase" [title]="estado().detalle" role="status">
        <span class="w-2 h-2 rounded-full" [class]="estado().punto"></span>
        <span class="hidden md:inline">{{ estado().texto }}</span>
      </div>

      <button type="button" (click)="store.exportarRespaldo()" class="hidden sm:flex items-center justify-center gap-1.5 h-10 px-2.5 sm:px-3 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-white/70 dark:hover:bg-white/10 transition-colors" title="Exportar respaldo (.json)">
        <app-icono nombre="download" class="text-indigo-600 dark:text-indigo-400" />
        <span class="hidden lg:inline">Exportar</span>
      </button>
      <label for="importar-respaldo" class="hidden sm:flex items-center justify-center gap-1.5 h-10 px-2.5 sm:px-3 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-white/70 dark:hover:bg-white/10 transition-colors cursor-pointer" title="Importar respaldo (.json)">
        <app-icono nombre="upload" class="text-indigo-600 dark:text-indigo-400" />
        <span class="hidden lg:inline">Importar</span>
      </label>
      <input #archivo id="importar-respaldo" type="file" accept=".json,application/json" class="hidden" (change)="importar(archivo)">

      <!-- Sesión: avatar con iniciales y cerrar sesión -->
      <span class="hidden sm:flex w-px h-6 bg-slate-300/70 dark:bg-white/10 mx-0.5"></span>
      <span class="hidden sm:flex w-9 h-9 rounded-full bg-gradient-to-br from-amber-400 to-rose-500 text-white text-xs font-bold items-center justify-center ring-2 ring-white/70 dark:ring-white/15 shadow-sm"
            [title]="sesion.usuario()?.name ?? ''" aria-hidden="true">{{ iniciales() }}</span>
      <button type="button" (click)="cerrarSesion()" class="flex items-center justify-center gap-1.5 h-10 px-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-rose-500/10 hover:text-rose-600 dark:hover:text-rose-300 transition-colors"
              [title]="'Cerrar sesión de ' + (sesion.usuario()?.name ?? '')" aria-label="Cerrar sesión">
        <app-icono nombre="log-out" />
      </button>
    </div>
  </div>
</header>
