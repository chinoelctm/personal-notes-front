@if (confirmService.solicitud(); as solicitud) {
  <div class="fixed inset-0 z-[60] bg-slate-900/40 backdrop-blur-md flex items-center justify-center p-4" role="dialog" aria-modal="true">
    <div class="vidrio-fuerte rounded-3xl max-w-md w-full overflow-hidden entrada">
      <div class="p-6 space-y-3">
        <h3 class="font-bold text-base text-slate-900 dark:text-white">{{ solicitud.titulo }}</h3>
        <p class="text-sm text-slate-600 dark:text-slate-300 whitespace-pre-line">{{ solicitud.mensaje }}</p>
      </div>
      <div class="px-6 pb-6 flex flex-col-reverse sm:flex-row gap-2">
        @for (opcion of solicitud.opciones; track opcion.valor) {
          <button type="button" (click)="confirmService.responder(opcion.valor)" class="flex-1 py-2.5 rounded-xl text-sm transition-colors" [class]="estilo(opcion.estilo)">
            {{ opcion.etiqueta }}
          </button>
        }
      </div>
    </div>
  </div>
}
